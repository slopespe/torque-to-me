name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # --no-deps on purpose: the full dependency tree pulls docling and
      # torch (gigabytes), but the test suite only exercises the pure-logic
      # modules. Install just what those modules import.
      - run: pip install -e . --no-deps
      - run: pip install pytest networkx requests "tomli>=2;python_version<'3.11'"
      - run: pytest
